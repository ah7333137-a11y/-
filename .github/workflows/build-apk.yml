name: بناء APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تنزيل المشروع
        uses: actions/checkout@v4

      - name: فك المشروع
        run: |
          unzip -o *.zip -d project

      - name: العثور على مشروع Android وبناء APK
        run: |
          GRADLEW=$(find project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "لم يتم العثور على ملف gradlew"
            echo "محتويات المشروع:"
            find project -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "تم العثور على المشروع في:"
          echo "$PROJECT_DIR"

          chmod +x "$GRADLEW"

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug

      - name: حفظ APK
        uses: actions/upload-artifact@v4
        with:
          name: AjrBetak-APK
          path: project/**/build/outputs/apk/**/*.apk
