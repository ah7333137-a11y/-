name: بناء APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تنزيل المشروع
        uses: actions/checkout@v4

      - name: فك ضغط المشروع
        run: |
          unzip -q ajr_baytak_android_project.zip -d project

      - name: العثور على مشروع Android
        run: |
          PROJECT_DIR=$(dirname "$(find project -name gradlew -type f | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: إعطاء صلاحية Gradle
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: بناء APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: حفظ APK
        uses: actions/upload-artifact@v4
        with:
          name: AjrBetak-APK
          path: "project/**/app/build/outputs/apk/debug/app-debug.apk"
